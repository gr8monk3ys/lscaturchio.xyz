name: Dependency Refresh

# Monthly minor/patch dependency refresh, landed as a rolling PR.
#
# Why this exists rather than Dependabot version updates:
#
# Dependabot's npm updater maintains package-lock.json. The bun migration
# (56095cc) deleted that file and CI now installs from bun.lock, which
# Dependabot never writes — so its PRs leave the lockfile stale and
# `bun install --frozen-lockfile` rejects them. That is the mechanism behind
# the repeatedly-failing "Dependabot Updates" runs, and it is why the
# sharp/libvips advisory (GHSA-f88m-g3jw-g9cj) stayed open for ~2 months.
#
# Version-update PRs from Dependabot were also deliberately turned off in
# f3323cd for being noisy. This is the low-noise replacement: one grouped PR
# a month, already verified against the full CI suite before you see it.
#
# Majors are never included — they need individual review. `bump-deps.mjs`
# lists the ones it skipped in the run summary so they stay visible.

on:
  schedule:
    # 07:00 UTC on the 1st of each month.
    - cron: '0 7 1 * *'
  workflow_dispatch:

concurrency:
  group: dep-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: chore/dep-refresh

jobs:
  refresh:
    name: Refresh minor/patch dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Bump minor/patch ranges
        id: bump
        run: |
          set -euo pipefail
          node scripts/bump-deps.mjs --json > bump-report.json
          node -e '
            const r = require("./bump-report.json");
            console.log(`applied=${r.applied.length}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `applied=${r.applied.length}\n`);
          '
        shell: bash

      - name: Summarise
        if: always()
        run: |
          {
            echo '### Dependency refresh'
            echo ''
            node -e '
              const r = require("./bump-report.json");
              if (r.applied.length) {
                console.log("| bump | package | from | to |");
                console.log("|---|---|---|---|");
                for (const a of r.applied) console.log(`| ${a.kind} | \`${a.name}\` | ${a.from} | ${a.to} |`);
              } else {
                console.log("Everything already current.");
              }
              if (r.skipped.length) {
                console.log("");
                console.log("**Majors held back (need individual review):**");
                console.log("");
                for (const s of r.skipped) console.log(`- \`${s.name}\` ${s.from} → ${s.to}`);
              }
            ' 2>/dev/null || echo 'No bump report produced.'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # Regenerating the lockfile is the whole point — this is the step
      # Dependabot cannot perform for this repo.
      - name: Install and regenerate bun.lock
        if: steps.bump.outputs.applied != '0'
        run: bun install
        shell: bash

      # Do not open a PR that CI would only reject. Every gate from ci.yml
      # except E2E/Lighthouse (which need a deployment) runs here first.
      - name: Verify
        if: steps.bump.outputs.applied != '0'
        run: |
          set -euo pipefail
          bun run lint
          bun run typecheck
          bun run knip
          bun run test:coverage
          bun run build
        shell: bash

      - name: Push rolling branch
        if: steps.bump.outputs.applied != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add package.json bun.lock
          git commit -m "chore(deps): refresh minor/patch dependencies

          Automated monthly refresh (.github/workflows/dep-refresh.yml).
          Majors are excluded and listed in the workflow run summary.
          Verified with lint, typecheck, knip, coverage, and build."
          git push --force origin "HEAD:$BRANCH"
        shell: bash

      - name: Open or confirm PR
        if: steps.bump.outputs.applied != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          state="$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || true)"
          if [ "$state" != "OPEN" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore(deps): refresh minor/patch dependencies" \
              --body "Automated monthly minor/patch refresh. Majors are excluded — see the [workflow run summary](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for the ones held back.

          Verified before this PR was opened: lint, typecheck, knip, coverage, build."
          fi

          # Verify rather than trust: a pushed branch with no PR is a silent failure.
          final="$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || true)"
          if [ "$final" != "OPEN" ]; then
            echo "::error::Branch $BRANCH was pushed but no open PR exists for it."
            exit 1
          fi
        shell: bash
