name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. Stacked PRs (a branch
  # based on another branch) were matching no trigger at all, so #187, #190,
  # #191 and #203 sat for days showing a green tick that was Vercel's preview
  # deploy, never Lint / Type Check / Test / Build / E2E. A check that cannot
  # fire is worse than no check: it reads as a pass. The repo is public, so
  # Actions minutes are unmetered and there is nothing to save here.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # verify-summary.mjs writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ESLint, knip (dead code / unused deps) and the retrieval-corpus drift
      # check (public/my-data/blog-*.md is derived from the essays). Same
      # command `bun run verify` runs locally.
      - name: Lint, knip, retrieval corpus sync
        run: bun run verify:lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Coverage thresholds, plus the VERIFY stage=unit line in the job summary.
      - name: Run unit tests with coverage thresholds
        run: bun run verify:test

      - name: Upload VERIFY stage counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-stage-test
          path: verify-stages/
          retention-days: 1

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Job-level timeout is the backstop; this step gets its own because the
      # `--with-deps` apt step has hung on an unreachable mirror before
      # (2026-08-19: two main runs sat here until the 6h ceiling cancelled them).
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: bunx playwright install --with-deps chromium

      # The Playwright webServer builds and serves the app itself, so this job
      # needs the same env as the build job.
      # Also writes the VERIFY stage=e2e line to the job summary.
      - name: Run e2e tests
        run: bun run verify:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
          OLLAMA_CHAT_MODEL: llama3.2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Upload VERIFY stage counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-stage-e2e
          path: verify-stages/
          retention-days: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Screenshots + traces of every e2e test, on every run, as UI evidence.
      - name: Upload UI evidence
        id: ui-evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence
          path: test-results/
          retention-days: 14

      - name: List UI evidence in job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.ui-evidence.outputs.artifact-url }}
        run: |
          {
            echo "### UI evidence"
            echo "Artifact: [ui-evidence](${ARTIFACT_URL:-none uploaded}) (screenshots + trace.zip per test; open traces with \`bunx playwright show-trace\`)"
            echo
            find test-results -name '*.png' 2>/dev/null | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Required for build - Neon PostgreSQL
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional - AI providers (set dummy values if not using)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
          OLLAMA_CHAT_MODEL: llama3.2
          # Optional - external services
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Optional - analytics and monitoring
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Optional - rate limiting
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  lighthouse:
    name: Lighthouse (score floors)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same env as Build. Without DATABASE_URL the server measured is the site
      # running without its database, which once reported 0.26 cumulative layout
      # shift against a 0.15 budget while the shipped site measured 0.006. A
      # gate that measures a different site than the one deployed fails for
      # reasons nobody can act on.
      #
      # NEXT_PUBLIC_AUDIO_CDN_URL is the deliberate exception: a score gate
      # should not depend on a third-party origin being reachable from a
      # runner. So this build has no audio origin, and the essay player must
      # make no audio request at all (src/lib/audio-url.ts returns null rather
      # than guessing a URL). When it guessed /audio/<slug>.mp3 — a path that
      # is in no build, since public/audio/*.mp3 is gitignored — every essay
      # route logged a 404 and lost the four best-practices points that
      # errors-in-console is worth.
      - name: Build for Lighthouse
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
          OLLAMA_CHAT_MODEL: llama3.2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # Port 3000 on purpose: it is in the CSRF allowlist by default, so the
      # view-counter POST the pages fire does not 403 and land in
      # errors-in-console (which alone costs best-practices four points).
      - name: Start application
        run: |
          bun run start -- --hostname 127.0.0.1 --port 3000 > /tmp/lscaturchio.log 2>&1 &
          echo $! > /tmp/lscaturchio.pid
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lscaturchio.log
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_EMBED_MODEL: nomic-embed-text
          OLLAMA_CHAT_MODEL: llama3.2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      # Floors and the document byte cap live in scripts/check-lighthouse-score.mjs.
      - name: Enforce Lighthouse score floors
        run: bun run lighthouse:ci

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-artifacts
          path: artifacts/lighthouse
          retention-days: 7

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/lscaturchio.pid ]; then
            kill "$(cat /tmp/lscaturchio.pid)" || true
          fi

  postdeploy-chat-smoke:
    name: Post-Deploy Chat Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify production chat endpoint
        run: node scripts/smoke-chat.mjs --base-url https://lscaturchio.xyz --attempts 30 --interval-ms 20000 --timeout-ms 20000 --allow-edge-block

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@v8
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: unit e2e
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
